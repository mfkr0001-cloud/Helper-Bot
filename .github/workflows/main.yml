name: Build AI Decorator (Android)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [Android32, Android64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.target }}
          build-config: Release
          combine: true

  package:
    name: Package Android builds
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine Android packages
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload combined .geode
        uses: actions/upload-artifact@v4
        with:
          name: AI-Decorator-Android
          path: ${{ steps.combine.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
